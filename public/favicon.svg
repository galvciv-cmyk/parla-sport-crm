<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="goldGlowFavicon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Azul Marino Profundo -->
  <rect width="100" height="100" rx="26" fill="#060D1E" />

  <!-- Anillo/Borde Dorado Rodeando -->
  <rect x="4" y="4" width="92" height="92" rx="22" stroke="url(#goldBorder)" stroke-width="5" fill="none" filter="url(#goldGlowFavicon)" />

  <!-- Letra P estilizada en Blanco -->
  <text x="50" y="70" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-size="62" 
        font-weight="900" 
        font-style="italic">
    P
  </text>
</svg>