<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" fill="none">
  <defs>
    <!-- Filtro de brillo dorado -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <!-- Texto Principal: PARLA en tipografía redondeada estilizada en Blanco -->
  <text x="210" y="95" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-size="78" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="0.04em">
    PARLA
  </text>

  <!-- Subtexto: SPORT en Blanco -->
  <text x="210" y="142" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="0.28em">
    SPORT
  </text>

  <!-- Línea y Estrellas/Cruces Doradas Flanqueando SPORT -->
  <!-- Línea Izquierda -->
  <line x1="30" y1="134" x2="125" y2="134" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" filter="url(#goldGlow)" />
  
  <!-- Cruz/Estrella Dorada Izquierda -->
  <g transform="translate(142, 134)" filter="url(#goldGlow)">
    <path d="M 0 -8 L 2.5 -2.5 L 8 0 L 2.5 2.5 L 0 8 L -2.5 2.5 L -8 0 L -2.5 -2.5 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Cruz/Estrella Dorada Derecha -->
  <g transform="translate(278, 134)" filter="url(#goldGlow)">
    <path d="M 0 -8 L 2.5 -2.5 L 8 0 L 2.5 2.5 L 0 8 L -2.5 2.5 L -8 0 L -2.5 -2.5 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Línea Derecha -->
  <line x1="295" y1="134" x2="390" y2="134" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" filter="url(#goldGlow)" />
</svg>
